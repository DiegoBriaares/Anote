name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run verify
      - name: Validate production composition
        env:
          ANOTE_DATA_DIR: /tmp/anote-ci-data
          ANOTE_IMAGE_TAG: ci
          ANOTE_BIND_ADDRESS: 127.0.0.1
          ANOTE_PUBLIC_PORT: 15173
          ANOTE_DEFAULT_TIME_ZONE: UTC
        run: docker compose -f compose.production.yaml config --quiet
      - run: docker build -f docker/api.Containerfile -t anote-api:ci .
      - run: docker build -f docker/web.Containerfile -t anote-web:ci .
