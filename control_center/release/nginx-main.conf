worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # A TLS terminator such as Tailscale Serve supplies both values. Direct
    # traffic supplies neither. Partial, multi-valued, or malformed forwarding
    # data is never allowed to become Anote's cookie/origin identity.
    map "$http_x_forwarded_proto|$http_x_forwarded_host" $anote_forwarding_state {
        default invalid;
        "~^\|$" direct;
        "~^(?:http|https)\|(?:[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$" forwarded;
    }
    map $anote_forwarding_state $anote_effective_proto {
        default "";
        direct $scheme;
        forwarded $http_x_forwarded_proto;
    }
    map $anote_forwarding_state $anote_effective_host {
        default "";
        direct $http_host;
        forwarded $http_x_forwarded_host;
    }

    include /etc/nginx/conf.d/*.conf;
}
